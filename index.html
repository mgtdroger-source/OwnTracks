<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TD Tour OwnTracks Setup v0.03</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f6f7;margin:0;padding:24px;color:#222}
.card{max-width:560px;margin:40px auto;background:#fff;border:1px solid #d7d7d7;border-radius:14px;padding:24px}
h1{font-size:24px;margin:0 0 10px}
p{line-height:1.45}
.btn{display:block;width:100%;box-sizing:border-box;text-align:center;border:0;border-radius:10px;padding:16px 18px;font-size:18px;font-weight:700;text-decoration:none;margin-top:16px;cursor:pointer}
.primary{background:#1769aa;color:#fff}
.secondary{background:#eceff1;color:#222}
.small{font-size:13px;color:#666}
#status{margin-top:12px;font-size:14px;min-height:20px}
</style>
</head>
<body>
<div class="card">
<h1>TD Tour OwnTracks Setup</h1>
<p>Tap below to open this Tour configuration in OwnTracks.</p>
<a class="btn primary" href="owntracks:///config?inline=eyJfdHlwZSI6ImNvbmZpZ3VyYXRpb24iLCJtb2RlIjozLCJ1cmwiOiJodHRwczovL3NjcmlwdC5nb29nbGUuY29tL21hY3Jvcy9zL0FLZnljYnlXYzVnVldxel9WWHY0UmtVLTZRd2Q1eHg1Sk14QTRoTlZxOGUwNkxFU0h6RzBxSGowV0RUc0RySHFVdDlYam4xTTdRL2V4ZWMiLCJtb25pdG9yaW5nIjoyLCJsb2NhdG9ySW50ZXJ2YWwiOjMwLCJtb3ZlTW9kZUxvY2F0b3JJbnRlcnZhbCI6MzAsImxvY2F0b3JEaXNwbGFjZW1lbnQiOjAsInBlZ0xvY2F0b3JGYXN0ZXN0SW50ZXJ2YWxUb0ludGVydmFsIjp0cnVlLCJhdXRvc3RhcnRPbkJvb3QiOnRydWUsImV4dGVuZGVkRGF0YSI6dHJ1ZSwibm90aWZpY2F0aW9uTG9jYXRpb24iOnRydWV9">Open in OwnTracks</a>
<button class="btn secondary" id="copyBtn">Copy OwnTracks setup link</button>
<div id="status"></div>
<p class="small">OwnTracks must already be installed.</p>
</div>
<script>
const setupLink = "owntracks:///config?inline=eyJfdHlwZSI6ImNvbmZpZ3VyYXRpb24iLCJtb2RlIjozLCJ1cmwiOiJodHRwczovL3NjcmlwdC5nb29nbGUuY29tL21hY3Jvcy9zL0FLZnljYnlXYzVnVldxel9WWHY0UmtVLTZRd2Q1eHg1Sk14QTRoTlZxOGUwNkxFU0h6RzBxSGowV0RUc0RySHFVdDlYam4xTTdRL2V4ZWMiLCJtb25pdG9yaW5nIjoyLCJsb2NhdG9ySW50ZXJ2YWwiOjMwLCJtb3ZlTW9kZUxvY2F0b3JJbnRlcnZhbCI6MzAsImxvY2F0b3JEaXNwbGFjZW1lbnQiOjAsInBlZ0xvY2F0b3JGYXN0ZXN0SW50ZXJ2YWxUb0ludGVydmFsIjp0cnVlLCJhdXRvc3RhcnRPbkJvb3QiOnRydWUsImV4dGVuZGVkRGF0YSI6dHJ1ZSwibm90aWZpY2F0aW9uTG9jYXRpb24iOnRydWV9";
document.getElementById('copyBtn').onclick = async () => {
  const s = document.getElementById('status');
  try {
    await navigator.clipboard.writeText(setupLink);
    s.textContent = 'Setup link copied.';
  } catch (e) {
    const ta=document.createElement('textarea');
    ta.value=setupLink; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
    s.textContent='Setup link copied.';
  }
};
</script>
</body>
</html>
